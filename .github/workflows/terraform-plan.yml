name: Terraform plan

on:
  pull_request:
    branches:
      - master

env:
  TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

jobs:
  terraform-plan:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838
        with:
          role-to-assume: arn:aws:iam::625715126488:role/GithubActions
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.5.5"
          cli_config_credentials_token: ${{ env.TF_API_TOKEN }}

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: changes
        with:
          filters: |
            eks-cluster:
              - 'eks-cluster/*'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov

      - name: Run Checkov Scan
        run: |
          checkov --directory eks-cluster --output-file checkov-results.sarif --output sarif --download-external-modules true || true

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
        env:
          GITHUB_REF: refs/heads/master
             
      - name: Terraform Init
        if: steps.changes.outputs.eks-cluster == 'true'
        run: |
          cd eks-cluster
          terraform init
      - name: Terraform Plan eks-cluster
        if: steps.changes.outputs.eks-cluster == 'true'
        run: |
          cd eks-cluster
          terraform plan